name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: |
          docker build . --file Dockerfile \
            --tag michaelacook/subnet-calculator:${{ github.ref_name }} \
            --tag michaelacook/subnet-calculator:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the Docker image
        run: |
          docker push michaelacook/subnet-calculator:${{ github.ref_name }}
          docker push michaelacook/subnet-calculator:latest
  # deploy:
